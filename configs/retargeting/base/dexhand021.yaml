extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["f_link1_2", "f_link1_3"]
    - human: [2, 3]
      robot: ["f_link1_3", "f_link1_4"]
    - human: [3, 4]
      robot: ["f_link1_4", "f_link1_4_tip"]
      robot_types: ["body", "site"]
    - human: [5, 6]
      robot: ["f_link2_2", "f_link2_3"]
    - human: [6, 7]
      robot: ["f_link2_3", "f_link2_4"]
    - human: [7, 8]
      robot: ["f_link2_4", "f_link2_4_tip"]
      robot_types: ["body", "site"]
    - human: [9, 10]
      robot: ["f_link3_2", "f_link3_3"]
    - human: [10, 11]
      robot: ["f_link3_3", "f_link3_4"]
    - human: [11, 12]
      robot: ["f_link3_4", "f_link3_4_tip"]
      robot_types: ["body", "site"]
    - human: [13, 14]
      robot: ["f_link4_2", "f_link4_3"]
    - human: [14, 15]
      robot: ["f_link4_3", "f_link4_4"]
    - human: [15, 16]
      robot: ["f_link4_4", "f_link4_4_tip"]
      robot_types: ["body", "site"]
    - human: [17, 18]
      robot: ["f_link5_2", "f_link5_3"]
    - human: [18, 19]
      robot: ["f_link5_3", "f_link5_4"]
    - human: [19, 20]
      robot: ["f_link5_4", "f_link5_4_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_tip", "index_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_tip", "middle_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_tip", "ring_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_tip", "pinky_tip"]
      robot_types: ["site", "site"]
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "f_link1_2"
      robot_primary: "f_link1_3"
      robot_secondary: "f_link2_2"
