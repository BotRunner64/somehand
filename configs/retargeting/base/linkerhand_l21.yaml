extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["thumb_metacarpals", "thumb_proximal"]
    - human: [2, 3]
      robot: ["thumb_proximal", "thumb_distal"]
    - human: [3, 4]
      robot: ["thumb_distal", "thumb_distal_tip"]
      robot_types: ["body", "site"]
    - human: [5, 6]
      robot: ["index_proximal", "index_middle"]
    - human: [6, 8]
      robot: ["index_middle", "index_middle_tip"]
      robot_types: ["body", "site"]
    - human: [9, 10]
      robot: ["middle_proximal", "middle_middle"]
    - human: [10, 12]
      robot: ["middle_middle", "middle_middle_tip"]
      robot_types: ["body", "site"]
    - human: [13, 14]
      robot: ["ring_proximal", "ring_middle"]
    - human: [14, 16]
      robot: ["ring_middle", "ring_middle_tip"]
      robot_types: ["body", "site"]
    - human: [17, 18]
      robot: ["pinky_proximal", "pinky_middle"]
    - human: [18, 20]
      robot: ["pinky_middle", "pinky_middle_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_tip", "index_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_tip", "middle_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_tip", "ring_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_tip", "pinky_tip"]
      robot_types: ["site", "site"]
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "thumb_metacarpals"
      robot_primary: "thumb_proximal"
      robot_secondary: "index_proximal"
