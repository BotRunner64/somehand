extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["thumb_abad_link", "thumb_mcp_link"]
    - human: [2, 3]
      robot: ["thumb_mcp_link", "thumb_pip_link"]
    - human: [3, 4]
      robot: ["thumb_pip_link", "thumb_dip_link"]
    - human: [3, 4]
      robot: ["thumb_dip_link", "thumb_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [5, 6]
      robot: ["index_abad_link", "index_pip_link"]
    - human: [6, 7]
      robot: ["index_pip_link", "index_dip_link"]
    - human: [7, 8]
      robot: ["index_dip_link", "index_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [9, 10]
      robot: ["middle_pip_link", "middle_dip_link"]
    - human: [10, 12]
      robot: ["middle_dip_link", "middle_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [13, 14]
      robot: ["ring_abad_link", "ring_pip_link"]
    - human: [14, 15]
      robot: ["ring_pip_link", "ring_dip_link"]
    - human: [15, 16]
      robot: ["ring_dip_link", "ring_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [17, 18]
      robot: ["pinky_abad_link", "pinky_pip_link"]
    - human: [18, 19]
      robot: ["pinky_pip_link", "pinky_dip_link"]
    - human: [19, 20]
      robot: ["pinky_dip_link", "pinky_dip_link_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_dip_link_tip", "index_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_dip_link_tip", "middle_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_dip_link_tip", "ring_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_dip_link_tip", "pinky_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [8, 5]
      robot: ["index_pip_link", "index_dip_link_tip"]
      robot_types: ["body", "site"]
      weight: 1200.0
      threshold: 0.10
    - human: [12, 9]
      robot: ["middle_pip_link", "middle_dip_link_tip"]
      robot_types: ["body", "site"]
      weight: 1000.0
      threshold: 0.10
    - human: [16, 13]
      robot: ["ring_pip_link", "ring_dip_link_tip"]
      robot_types: ["body", "site"]
      weight: 900.0
      threshold: 0.10
  angle_constraints:
    - landmarks: [1, 2, 4]
      joint: "thumb_mcp_joint"
      weight: 1.2
    - landmarks: [2, 3, 4]
      joint: "thumb_pip_joint"
    - landmarks: [5, 6, 8]
      joint: "index_pip_joint"
      weight: 1.4
    - landmarks: [6, 7, 8]
      joint: "index_dip_joint"
      weight: 1.2
    - landmarks: [9, 10, 12]
      joint: "middle_pip_joint"
      weight: 1.4
    - landmarks: [10, 11, 12]
      joint: "middle_dip_joint"
      weight: 1.2
    - landmarks: [13, 14, 16]
      joint: "ring_pip_joint"
      weight: 1.4
    - landmarks: [14, 15, 16]
      joint: "ring_dip_joint"
      weight: 1.2
    - landmarks: [17, 18, 20]
      joint: "pinky_pip_joint"
      weight: 1.4
    - landmarks: [18, 19, 20]
      joint: "pinky_dip_joint"
      weight: 1.2
