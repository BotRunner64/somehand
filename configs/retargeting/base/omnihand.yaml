extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["thumb_abad_link", "thumb_mcp_link"]
    - human: [2, 3]
      robot: ["thumb_mcp_link", "thumb_pip_link"]
    - human: [3, 4]
      robot: ["thumb_pip_link", "thumb_dip_link"]
    - human: [3, 4]
      robot: ["thumb_dip_link", "thumb_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [5, 6]
      robot: ["index_abad_link", "index_pip_link"]
    - human: [6, 7]
      robot: ["index_pip_link", "index_dip_link"]
    - human: [7, 8]
      robot: ["index_dip_link", "index_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [9, 10]
      robot: ["middle_pip_link", "middle_dip_link"]
    - human: [10, 12]
      robot: ["middle_dip_link", "middle_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [13, 14]
      robot: ["ring_abad_link", "ring_pip_link"]
    - human: [14, 15]
      robot: ["ring_pip_link", "ring_dip_link"]
    - human: [15, 16]
      robot: ["ring_dip_link", "ring_dip_link_tip"]
      robot_types: ["body", "site"]
    - human: [17, 18]
      robot: ["pinky_abad_link", "pinky_pip_link"]
    - human: [18, 19]
      robot: ["pinky_pip_link", "pinky_dip_link"]
    - human: [19, 20]
      robot: ["pinky_dip_link", "pinky_dip_link_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_dip_link_tip", "index_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_dip_link_tip", "middle_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_dip_link_tip", "ring_dip_link_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_dip_link_tip", "pinky_dip_link_tip"]
      robot_types: ["site", "site"]
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "thumb_abad_link"
      robot_primary: "thumb_mcp_link"
      robot_secondary: "index_abad_link"
