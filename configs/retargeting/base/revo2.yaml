extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["thumb_metacarpal_link", "thumb_proximal_link"]
    - human: [2, 3]
      robot: ["thumb_proximal_link", "thumb_distal_link"]
    - human: [3, 4]
      robot: ["thumb_distal_link", "thumb_distal_link_tip"]
      robot_types: ["body", "site"]
    - human: [5, 7]
      robot: ["index_proximal_link", "index_distal_link"]
    - human: [7, 8]
      robot: ["index_distal_link", "index_distal_link_tip"]
      robot_types: ["body", "site"]
    - human: [9, 11]
      robot: ["middle_proximal_link", "middle_distal_link"]
    - human: [11, 12]
      robot: ["middle_distal_link", "middle_distal_link_tip"]
      robot_types: ["body", "site"]
    - human: [13, 15]
      robot: ["ring_proximal_link", "ring_distal_link"]
    - human: [15, 16]
      robot: ["ring_distal_link", "ring_distal_link_tip"]
      robot_types: ["body", "site"]
    - human: [17, 19]
      robot: ["pinky_proximal_link", "pinky_distal_link"]
    - human: [19, 20]
      robot: ["pinky_distal_link", "pinky_distal_link_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_tip", "index_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_tip", "middle_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_tip", "ring_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_tip", "pinky_tip"]
      robot_types: ["site", "site"]
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "thumb_metacarpal_link"
      robot_primary: "thumb_proximal_link"
      robot_secondary: "index_proximal_link"
