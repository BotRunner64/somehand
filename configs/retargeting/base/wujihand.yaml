extends: "./_universal_common.yaml"

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["finger1_link2", "finger1_link3"]
    - human: [2, 3]
      robot: ["finger1_link3", "finger1_link4"]
    - human: [3, 4]
      robot: ["finger1_link4", "finger1_link4_tip"]
      robot_types: ["body", "site"]
    - human: [5, 6]
      robot: ["finger2_link2", "finger2_link3"]
    - human: [6, 7]
      robot: ["finger2_link3", "finger2_link4"]
    - human: [7, 8]
      robot: ["finger2_link4", "finger2_link4_tip"]
      robot_types: ["body", "site"]
    - human: [9, 10]
      robot: ["finger3_link2", "finger3_link3"]
    - human: [10, 11]
      robot: ["finger3_link3", "finger3_link4"]
    - human: [11, 12]
      robot: ["finger3_link4", "finger3_link4_tip"]
      robot_types: ["body", "site"]
    - human: [13, 14]
      robot: ["finger4_link2", "finger4_link3"]
    - human: [14, 15]
      robot: ["finger4_link3", "finger4_link4"]
    - human: [15, 16]
      robot: ["finger4_link4", "finger4_link4_tip"]
      robot_types: ["body", "site"]
    - human: [17, 18]
      robot: ["finger5_link2", "finger5_link3"]
    - human: [18, 19]
      robot: ["finger5_link3", "finger5_link4"]
    - human: [19, 20]
      robot: ["finger5_link4", "finger5_link4_tip"]
      robot_types: ["body", "site"]
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_tip", "index_tip"]
      robot_types: ["site", "site"]
    - human: [4, 12]
      robot: ["thumb_tip", "middle_tip"]
      robot_types: ["site", "site"]
    - human: [4, 16]
      robot: ["thumb_tip", "ring_tip"]
      robot_types: ["site", "site"]
    - human: [4, 20]
      robot: ["thumb_tip", "pinky_tip"]
      robot_types: ["site", "site"]
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "finger1_link2"
      robot_primary: "finger1_link3"
      robot_secondary: "finger2_link2"
