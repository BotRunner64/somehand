extends: "./_universal_common.yaml"

hand:
  name: rohand_right
  side: right
  mjcf_path: ../../../assets/mjcf/rohand_right/model.xml

retargeting:
  vector_constraints:
    - human: [1, 2]
      robot: ["th_root_link", "th_slider_link"]
      weight: 1.0
    - human: [2, 3]
      robot: ["th_slider_link", "th_distal_link"]
      weight: 1.0
    - human: [3, 4]
      robot: ["th_distal_link", "th_distal_link_tip"]
      robot_types: ["body", "site"]
      weight: 0.9
    - human: [5, 6]
      robot: ["if_proximal_link", "if_distal_link"]
      weight: 1.0
    - human: [6, 7]
      robot: ["if_distal_link", "if_connecting_link"]
      weight: 1.0
    - human: [7, 8]
      robot: ["if_connecting_link", "if_distal_link_tip"]
      robot_types: ["body", "site"]
      weight: 0.9
    - human: [9, 10]
      robot: ["mf_proximal_link", "mf_distal_link"]
      weight: 1.0
    - human: [10, 11]
      robot: ["mf_distal_link", "mf_connecting_link"]
      weight: 1.0
    - human: [11, 12]
      robot: ["mf_connecting_link", "mf_distal_link_tip"]
      robot_types: ["body", "site"]
      weight: 0.9
    - human: [13, 14]
      robot: ["rf_proximal_link", "rf_distal_link"]
      weight: 1.0
    - human: [14, 15]
      robot: ["rf_distal_link", "rf_connecting_link"]
      weight: 1.0
    - human: [15, 16]
      robot: ["rf_connecting_link", "rf_distal_link_tip"]
      robot_types: ["body", "site"]
      weight: 0.9
    - human: [17, 18]
      robot: ["lf_proximal_link", "lf_distal_link"]
      weight: 1.0
    - human: [18, 19]
      robot: ["lf_distal_link", "lf_connecting_link"]
      weight: 1.0
    - human: [19, 20]
      robot: ["lf_connecting_link", "lf_distal_link_tip"]
      robot_types: ["body", "site"]
      weight: 0.9
  distance_constraints:
    - human: [4, 8]
      robot: ["thumb_tip", "index_tip"]
      robot_types: ["site", "site"]
      weight: 2000.0
      scale: 1.0
      threshold: 0.04
      activation_type: "linear"
      scale_mode: "hand_scaled"
    - human: [4, 12]
      robot: ["thumb_tip", "middle_tip"]
      robot_types: ["site", "site"]
      weight: 1500.0
      scale: 1.0
      threshold: 0.04
      activation_type: "linear"
      scale_mode: "hand_scaled"
    - human: [4, 16]
      robot: ["thumb_tip", "ring_tip"]
      robot_types: ["site", "site"]
      weight: 1000.0
      scale: 1.0
      threshold: 0.04
      activation_type: "linear"
      scale_mode: "hand_scaled"
    - human: [4, 20]
      robot: ["thumb_tip", "pinky_tip"]
      robot_types: ["site", "site"]
      weight: 800.0
      scale: 1.0
      threshold: 0.04
      activation_type: "linear"
      scale_mode: "hand_scaled"
  frame_constraints:
    - name: "thumb_cmc_frame"
      human_origin: 1
      human_primary: 2
      human_secondary: 5
      robot_origin: "th_root_link"
      robot_primary: "th_slider_link"
      robot_secondary: "if_proximal_link"
      primary_weight: 2.0
      secondary_weight: 1.8
